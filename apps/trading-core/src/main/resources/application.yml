spring:
  application:
    name: trading-core
  profiles:
    default: development
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${DB_USER:trading}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
trading:
  mode: ${TRADING_MODE:PAPER}
  enable-live-trading: ${ENABLE_LIVE_TRADING:false}
  emergency-stop: ${EMERGENCY_STOP:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
logging:
  structured:
    format:
      console: logstash
