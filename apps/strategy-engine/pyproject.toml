[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "strategy-engine"
version = "0.1.0"
description = "Signal-only quantitative plane for kite-hybrid-platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "jsonschema[format]>=4.23,<5",
  "types-jsonschema>=4.23",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_engine"]
